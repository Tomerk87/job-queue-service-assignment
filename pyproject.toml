[project]
name = "job-queue-service"
version = "0.1.0"
description = "Distributed background job queue: FastAPI API, PostgreSQL state, Redis wake-ups, Python workers."
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt; test tooling in requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
# Only application code is measured; alembic/ (migrations) and tests/ are outside "app".
source = ["app"]

[tool.coverage.report]
show_missing = true
# Pure entrypoint boilerplate; the code it calls (worker.main) is still measured.
exclude_also = ['if __name__ == .__main__.:']
